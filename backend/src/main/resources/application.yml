spring:
  application:
    name: raahi-backend

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raahi}
    username: ${DB_USER:raahi}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway, never by Hibernate auto-DDL
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms

server:
  port: ${PORT:8080}

raahi:
  jwt:
    secret: ${JWT_SECRET:}          # MUST be set via env var in every environment, no fallback in prod
    expiry-days: ${JWT_EXPIRY_DAYS:30}
  auth:
    dev-mock-enabled: ${RAAHI_DEV_AUTH_ENABLED:false}  # Strictly false in prod; rejects dev-mock tokens
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}   # path to service account json, never committed
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini-api-key: ${GEMINI_API_KEY:}   # backend-only, never sent to Android
    gemini-model: ${GEMINI_MODEL:${RAAHI_AI_GEMINI_MODEL:gemini-1.5-flash}}
    gemini-api-version: ${GEMINI_API_VERSION:v1beta}
    gemini-endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com}
  google:
    api-key: ${GOOGLE_MAPS_API_KEY:${GOOGLE_API_KEY:}}
  commission:
    rate: ${RAAHI_COMMISSION_RATE:0.10}          # 10% of the job amount, owed by the helper to Raahi
  cancellation:
    threshold: ${RAAHI_CANCEL_THRESHOLD:4}       # abusive pre-arrival cancellations inside the window
    window-days: ${RAAHI_CANCEL_WINDOW_DAYS:30}
  cancellation-protection:
    enabled: ${RAAHI_CANCEL_PROTECTION_ENABLED:true}
    base-rate-per-km: ${RAAHI_CANCEL_RATE_PER_KM:12.0}          # Travel compensation rate per km
    base-callout-fee: ${RAAHI_CANCEL_CALLOUT_FEE:50.0}          # Base dispatch allowance
    return-distance-factor: ${RAAHI_CANCEL_RETURN_FACTOR:0.5}   # Factor for return trip coverage
    min-dispatch-distance-km: ${RAAHI_CANCEL_MIN_KM:0.5}        # Minimum distance to qualify for travel loss
    max-compensation-cap: ${RAAHI_CANCEL_MAX_CAP:500.0}         # Maximum compensation ceiling per job
    max-daily-claims-per-helper: ${RAAHI_CANCEL_DAILY_MAX:3}    # Flag/audit warning threshold for claims per 24 hours per helper
  job:
    arrival-radius-m: ${RAAHI_ARRIVAL_RADIUS_M:200}
  subscription:
    # MVP: false because checkout/activation/renewal is not implemented yet. Set true (env var)
    # once the real payment lifecycle exists. Never fake an ACTIVE subscription to get around it.
    enforce-job-creation: ${RAAHI_SUBSCRIPTION_ENFORCE_JOB_CREATION:false}
  shop:
    amazon-affiliate-tag: ${AMAZON_AFFILIATE_TAG:}   # optional; links work without it, just unattributed
  payment:
    razorpay-key-id: ${RAZORPAY_KEY_ID:}             # unset = Subscription checkout is honestly reported as unavailable

logging:
  level:
    in.raahi.backend: INFO
